<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="DevOps Lab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b24"/><stop offset="1" stop-color="#1a0b33"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#ff3d9a;#fbbf24;#22d3ee" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#8b5cf6"><animate attributeName="stop-color" values="#8b5cf6;#fbbf24;#22d3ee;#8b5cf6" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="260" rx="22" fill="url(#bg)"/>

  <!-- floating orbs -->
  <circle cx="120" cy="60" r="34" fill="#ff3d9a" opacity=".35" filter="url(#glow)"><animate attributeName="cy" values="60;90;60" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="880" cy="190" r="44" fill="#22d3ee" opacity=".30" filter="url(#glow)"><animate attributeName="cy" values="190;150;190" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="800" cy="50" r="22" fill="#fbbf24" opacity=".40" filter="url(#glow)"><animate attributeName="cx" values="800;840;800" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="210" r="26" fill="#a3e635" opacity=".30" filter="url(#glow)"><animate attributeName="cx" values="200;240;200" dur="7s" repeatCount="indefinite"/></circle>

  <!-- spinning helm-like wheel -->
  <g transform="translate(500 68)" filter="url(#glow)">
    <g stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" fill="none">
      <circle r="26"/>
      <path d="M0-26V26M-26 0H26M-18-18L18 18M18-18L-18 18"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <text x="500" y="156" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="900" fill="url(#txt)" filter="url(#glow)">DevOps Lab</text>
  <text x="500" y="196" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#c4c6ff">Jenkins · ArgoCD · Kubernetes · Prometheus · Grafana</text>
  <text x="500" y="226" text-anchor="middle" font-family="Menlo,monospace" font-size="15" fill="#a3e635">$ lab up<tspan fill="#a3e635"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/> ▌</tspan></text>
</svg>
