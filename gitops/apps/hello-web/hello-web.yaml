apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-web-page
data:
  index.html: |
    <h1>hello-web</h1><p>Deployed by ArgoCD from a local folder.</p>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web
spec:
  replicas: 2
  selector:
    matchLabels: {app: hello-web}
  template:
    metadata:
      labels: {app: hello-web}
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports: [{containerPort: 80}]
          volumeMounts:
            - {name: page, mountPath: /usr/share/nginx/html}
      volumes:
        - name: page
          configMap: {name: hello-web-page}
---
apiVersion: v1
kind: Service
metadata:
  name: hello-web
spec:
  selector: {app: hello-web}
  ports: [{port: 80, targetPort: 80}]
